name: OctopIOS

options:
  bundleIdPrefix: com.clionooo
  createIntermediateGroups: true
  groupSortPosition: top
  deploymentTarget:
    iOS: "15.0"

settings:
  base:
    MARKETING_VERSION: "1.1.2"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    DEVELOPMENT_TEAM: ""

targets:
  OctopIOS:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: OctopIOS
    settings:
      base:
        PRODUCT_NAME: OctopIOS
        PRODUCT_BUNDLE_IDENTIFIER: com.clionooo.octopios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        SWIFT_EMIT_LOC_STRINGS: "NO"
    info:
      path: Info.plist
      properties:
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleName: "$(PRODUCT_NAME)"
        CFBundlePackageType: APPL
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleDisplayName: OCTOP
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: zh_CN
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UILaunchScreen:
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: 用于连接局域网内的 Octop 服务器。
        NSPhotoLibraryUsageDescription: 用于选择图片上传到 Octop。
        ITSAppUsesNonExemptEncryption: false

schemes:
  OctopIOS:
    build:
      targets:
        OctopIOS: all
    run:
      config: Debug
    archive:
      config: Release
